# Install project dependencies (runs during builds, surfaced to agent at session start).
maintenance: |
  # No pyenv on the build VM: python3 resolves to the Homebrew Python whose
  # site-packages are PEP 668 externally-managed, so a bare pip install fails.
  # Install into a repo-local .venv (gitignored) instead; it persists into the
  # snapshot so sessions get working build/lint/test commands via .venv/bin.
  python3 -m venv .venv
  .venv/bin/pip install --upgrade pip
  .venv/bin/pip install -r scripts/requirements-dev.txt
  .venv/bin/pip install -e .
knowledge:
  - name: build
    contents: |
      .venv/bin/python setup.py --name
      .venv/bin/python -m py_compile scripts/*.py
  - name: lint
    contents: |
      .venv/bin/python -m black --check scripts
      .venv/bin/python -m flake8 scripts/
  - name: test
    contents: |
      .venv/bin/python -m pytest scripts/tests/ -v
  - name: test-status
    contents: |
      Full suite passes (152 tests, verified on the VM's Homebrew Python 3.12).
  - name: python-version
    contents: |
      Deps live in the repo-local .venv (Homebrew Python 3.12 on the VM); CI additionally validates 3.10/3.11, and all pinned versions support 3.10-3.13. Runtime dependencies (pandas, numpy, openpyxl) are pinned with exact versions in scripts/requirements.txt; dev/test/lint tools live in scripts/requirements-dev.txt. setup.py only installs the runtime set.

runs-on: macos
# One-time setup (e.g., install system tools, global CLIs).
initialize: |
  brew install actionlint
