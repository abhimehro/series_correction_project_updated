# .github/workflows/python-tests.yml
# GitHub Actions workflow for running the Python test suite using pytest.

name: Python Tests

permissions:
  contents: read
  id-token: write

# Controls when the workflow will run
on:
  # Triggers the workflow on push events but only for the main branch
  push:
    branches: [main]
  # Triggers the workflow on pull request events but only for the main branch
  pull_request:
    branches: [main]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  # This workflow contains a single job called "test"
  test:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Define a matrix strategy to run tests on supported Python versions
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      # Step 1: Check out the repository code
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Step 2: Set up Python environment for the current matrix version
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      # Step 3: Install dependencies and the package itself
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          pip install .

      # Step 4: Run tests with pytest and generate a coverage report
      - name: Test with pytest
        run: pytest --cov=scripts scripts/tests/ --cov-report=xml

      # Step 5: Upload coverage report to Codecov (best-effort)
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true
